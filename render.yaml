services:
  - type: web
    name: revendeja
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYMENT_API_BASE
        sync: false
      - key: PAYMENT_API_TOKEN
        sync: false
      - key: PAYMENT_CALLBACK_SECRET
        sync: false
